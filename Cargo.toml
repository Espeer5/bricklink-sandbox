[package]
name = "bricklink-sandbox"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
description = "An unofficial local BrickLink Store API simulator for integration tests"
license = "MIT"
repository = "https://github.com/Espeer5/bricklink-sandbox"
readme = "README.md"

[dependencies]
axum = "0.8"
base64 = "0.22"
chrono = { version = "0.4", default-features = false, features = ["clock"] }
clap = { version = "4", features = ["derive"] }
futures-util = "0.3"
hmac = "0.12"
rust_decimal = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_path_to_error = "0.1"
sha1 = "0.10"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "net", "signal", "sync", "time", "io-util"] }
url = "2"

[dev-dependencies]
tower = { version = "0.5", features = ["util"] }
