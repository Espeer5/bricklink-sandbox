[package]
name = "bricklink-sandbox"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
description = "An unofficial local BrickLink Store API simulator for integration tests"
license = "MIT"
repository = "https://github.com/Espeer5/bricklink-sandbox"
readme = "README.md"

[dependencies]
axum = "0.8"
chrono = { version = "0.4", default-features = false, features = ["clock"] }
clap = { version = "4", features = ["derive"] }
rust_decimal = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "net", "signal", "sync"] }
url = "2"

[dev-dependencies]
tower = { version = "0.5", features = ["util"] }
